<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعليم عبد الله</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3d3e;--panel:#f7f9f8;--ink:#14282a;--chalk:#f2c14e;--muted:#5b7274;--err:#b3261e;--line:#cfdad9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:420px}
h1{color:#fff;font-size:2rem;font-weight:800;margin:0 0 6px}
.sub{color:#b9d3d2;margin:0 0 24px}
.card{background:var(--panel);border-radius:14px;padding:24px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:0;border-bottom:3px solid var(--line);background:none;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button.on{border-color:var(--chalk);color:var(--ink);font-weight:800}
label{display:block;font-weight:500;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,button:focus-visible{outline:3px solid var(--chalk);outline-offset:1px}
.go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--bg);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.go:disabled{opacity:.6}
.link{background:none;border:0;color:var(--muted);font:inherit;margin-top:12px;cursor:pointer;text-decoration:underline;padding:0}
#msg{min-height:1.4em;margin:12px 0 0;font-size:.95rem}
#msg.err{color:var(--err)} #msg.ok{color:#1b6b3a}
.hide{display:none}
#home h2{margin:0 0 8px}
</style>
</head>
<body>
<main>
  <h1>تعليم عبد الله</h1>
  <p class="sub">سجّل دخولك وكمّل دروسك.</p>

  <section class="card" id="auth">
    <div class="tabs">
      <button id="tabLogin" class="on" type="button">تسجيل الدخول</button>
      <button id="tabSignup" type="button">حساب جديد</button>
    </div>
    <div id="nameRow" class="hide">
      <label for="name">الاسم</label>
      <input id="name" autocomplete="name">
    </div>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" dir="ltr" autocomplete="email">
    <label for="pass">كلمة المرور</label>
    <input id="pass" type="password" dir="ltr" autocomplete="current-password">
    <button class="go" id="go" type="button">تسجيل الدخول</button>
    <button class="link" id="reset" type="button">نسيت كلمة المرور؟</button>
    <p id="msg" role="alert"></p>
  </section>

  <section class="card hide" id="home">
    <h2 id="hello"></h2>
    <p>تم تسجيل دخولك بنجاح. هنا هتظهر كورساتك قريبًا.</p>
    <button class="go" id="out" type="button">تسجيل الخروج</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMyhCRHxunVYjkzrIB7H5Gb0NTTMj56Ug",
  authDomain: "abdalla-education.firebaseapp.com",
  projectId: "abdalla-education",
  storageBucket: "abdalla-education.firebasestorage.app",
  messagingSenderId: "88781209792",
  appId: "1:88781209792:web:f8ae7feec4d607ccbbed25"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();

const $ = id => document.getElementById(id);
let mode = "login";

function setMode(m){
  mode = m;
  $("tabLogin").classList.toggle("on", m==="login");
  $("tabSignup").classList.toggle("on", m==="signup");
  $("nameRow").classList.toggle("hide", m==="login");
  $("go").textContent = m==="login" ? "تسجيل الدخول" : "إنشاء الحساب";
  $("pass").autocomplete = m==="login" ? "current-password" : "new-password";
  say("");
}
function say(t, type){ const m=$("msg"); m.textContent=t; m.className=type||""; }

const errors = {
  "auth/invalid-email":"البريد الإلكتروني غير صحيح.",
  "auth/missing-password":"اكتب كلمة المرور.",
  "auth/weak-password":"كلمة المرور لازم تكون 6 حروف أو أرقام على الأقل.",
  "auth/email-already-in-use":"البريد ده مسجّل قبل كده. جرّب تسجيل الدخول.",
  "auth/invalid-credential":"البريد أو كلمة المرور غلط.",
  "auth/user-not-found":"مفيش حساب بالبريد ده.",
  "auth/wrong-password":"كلمة المرور غلط.",
  "auth/too-many-requests":"محاولات كتير. استنى شوية وجرّب تاني.",
  "auth/network-request-failed":"مفيش اتصال بالإنترنت."
};
const fail = e => say(errors[e.code] || "حصلت مشكلة. جرّب تاني.", "err");

$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");

$("go").onclick = async () => {
  const email = $("email").value.trim(), pass = $("pass").value, name = $("name").value.trim();
  if (mode==="signup" && !name) return say("اكتب اسمك.", "err");
  $("go").disabled = true; say("");
  try {
    if (mode==="signup") {
      const { user } = await auth.createUserWithEmailAndPassword(email, pass);
      await user.updateProfile({ displayName: name });
      await db.collection("users").doc(user.uid).set({
        name, email, role: "student",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      $("hello").textContent = "أهلًا يا " + name;
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
  } catch (e) { fail(e); }
  $("go").disabled = false;
};

$("reset").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return say("اكتب بريدك الأول وبعدين اضغط «نسيت كلمة المرور».", "err");
  try { await auth.sendPasswordResetEmail(email); say("بعتنا لك رابط تغيير كلمة المرور على بريدك.", "ok"); }
  catch (e) { fail(e); }
};

$("out").onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  $("auth").classList.toggle("hide", !!user);
  $("home").classList.toggle("hide", !user);
  if (user) $("hello").textContent = "أهلًا يا " + (user.displayName || "طالبنا");
});
</script>
</body>
</html>
