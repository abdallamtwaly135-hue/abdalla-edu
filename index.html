<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعليم عبد الله</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3d3e;--panel:#f7f9f8;--ink:#14282a;--chalk:#f2c14e;--muted:#5b7274;--err:#b3261e;--line:#cfdad9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:20px}
main{width:100%;max-width:560px;margin:0 auto}
h1{color:#fff;font-size:2rem;font-weight:800;margin:0 0 6px}
.sub{color:#b9d3d2;margin:0 0 20px}
.card{background:var(--panel);border-radius:14px;padding:22px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:0;border-bottom:3px solid var(--line);background:none;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button.on{border-color:var(--chalk);color:var(--ink);font-weight:800}
label{display:block;font-weight:500;margin:12px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:80px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--chalk);outline-offset:1px}
.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:8px;background:var(--bg);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.go.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.go:disabled{opacity:.6}
.link{background:none;border:0;color:var(--muted);font:inherit;margin-top:12px;cursor:pointer;text-decoration:underline;padding:0}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.95rem}
.err{color:var(--err)} .ok{color:#1b6b3a}
.hide{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:16px;gap:10px}
.bar button{background:none;border:1px solid #7fa3a2;color:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.item{display:block;width:100%;text-align:right;background:var(--panel);border:0;border-radius:12px;padding:16px;margin-bottom:10px;font:inherit;cursor:pointer;border-inline-start:6px solid var(--chalk)}
.item b{display:block;font-size:1.1rem;margin-bottom:4px}
.item span{color:var(--muted);font-size:.95rem}
.back{background:none;border:0;color:#b9d3d2;font:inherit;cursor:pointer;margin-bottom:12px;padding:0}
.player{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:12px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
h2{margin:0 0 6px}
.empty{color:#b9d3d2;text-align:center;padding:30px 0}
</style>
</head>
<body>
<main>
  <h1>تعليم عبد الله</h1>
  <p class="sub" id="sub">سجّل دخولك وكمّل دروسك.</p>

  <section class="card" id="auth">
    <div class="tabs">
      <button id="tabLogin" class="on" type="button">تسجيل الدخول</button>
      <button id="tabSignup" type="button">حساب جديد</button>
    </div>
    <div id="nameRow" class="hide"><label for="name">الاسم</label><input id="name" autocomplete="name"></div>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" dir="ltr" autocomplete="email">
    <label for="pass">كلمة المرور</label>
    <input id="pass" type="password" dir="ltr" autocomplete="current-password">
    <button class="go" id="go" type="button">تسجيل الدخول</button>
    <button class="link" id="reset" type="button">نسيت كلمة المرور؟</button>
    <p id="msg" class="msg" role="alert"></p>
  </section>

  <section id="app" class="hide">
    <div class="bar"><span id="hello"></span><button id="out" type="button">تسجيل الخروج</button></div>
    <div id="view"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMyhCRHxunVYjkzrIB7H5Gb0NTTMj56Ug",
  authDomain: "abdalla-education.firebaseapp.com",
  projectId: "abdalla-education",
  storageBucket: "abdalla-education.firebasestorage.app",
  messagingSenderId: "88781209792",
  appId: "1:88781209792:web:f8ae7feec4d607ccbbed25"
};
// إيميل المدرس (هو الوحيد اللي يقدر يضيف كورسات ودروس)
const ADMIN_EMAIL = "abdallamtwaly135@gmail.com";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let mode = "login", isAdmin = false;

/* ---------- تسجيل الدخول ---------- */
function setMode(m){
  mode = m;
  $("tabLogin").classList.toggle("on", m==="login");
  $("tabSignup").classList.toggle("on", m==="signup");
  $("nameRow").classList.toggle("hide", m==="login");
  $("go").textContent = m==="login" ? "تسجيل الدخول" : "إنشاء الحساب";
  say("");
}
function say(t, type){ const m=$("msg"); m.textContent=t; m.className="msg "+(type||""); }
const errors = {
  "auth/invalid-email":"البريد الإلكتروني غير صحيح.",
  "auth/missing-password":"اكتب كلمة المرور.",
  "auth/weak-password":"كلمة المرور لازم تكون 6 حروف أو أرقام على الأقل.",
  "auth/email-already-in-use":"البريد ده مسجّل قبل كده. جرّب تسجيل الدخول.",
  "auth/invalid-credential":"البريد أو كلمة المرور غلط.",
  "auth/user-not-found":"مفيش حساب بالبريد ده.",
  "auth/wrong-password":"كلمة المرور غلط.",
  "auth/too-many-requests":"محاولات كتير. استنى شوية وجرّب تاني.",
  "auth/network-request-failed":"مفيش اتصال بالإنترنت."
};
const fail = e => say(errors[e.code] || "حصلت مشكلة. جرّب تاني.", "err");
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");

$("go").onclick = async () => {
  const email = $("email").value.trim(), pass = $("pass").value, name = $("name").value.trim();
  if (mode==="signup" && !name) return say("اكتب اسمك.", "err");
  $("go").disabled = true; say("");
  try {
    if (mode==="signup") {
      const { user } = await auth.createUserWithEmailAndPassword(email, pass);
      await user.updateProfile({ displayName: name });
      await db.collection("users").doc(user.uid).set({ name, email, role:"student",
        createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      $("hello").textContent = "أهلًا يا " + name;
    } else await auth.signInWithEmailAndPassword(email, pass);
  } catch (e) { fail(e); }
  $("go").disabled = false;
};
$("reset").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return say("اكتب بريدك الأول وبعدين اضغط «نسيت كلمة المرور».", "err");
  try { await auth.sendPasswordResetEmail(email); say("بعتنا لك رابط تغيير كلمة المرور على بريدك.", "ok"); }
  catch (e) { fail(e); }
};
$("out").onclick = () => auth.signOut();

/* ---------- الكورسات والدروس ---------- */
const view = $("view");
const dbErr = e => e.code === "permission-denied"
  ? "مفيش صلاحية. لازم تحدّث قواعد Firestore."
  : "حصلت مشكلة في تحميل البيانات. جرّب تاني.";

function ytEmbed(u){
  const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? "https://www.youtube-nocookie.com/embed/" + m[1] : null;
}

async function showCourses(){
  view.innerHTML = '<p class="empty">جاري التحميل...</p>';
  try {
    const snap = await db.collection("courses").orderBy("createdAt","desc").get();
    let h = "";
    if (isAdmin) h += `<div class="card"><h2>إضافة كورس</h2>
      <label for="cT">اسم الكورس</label><input id="cT">
      <label for="cD">وصف قصير</label><textarea id="cD"></textarea>
      <button class="go" id="addCourse" type="button">إضافة الكورس</button><p id="cMsg" class="msg"></p></div>`;
    h += snap.empty ? '<p class="empty">لسه مفيش كورسات.</p>' :
      snap.docs.map(d => { const c = d.data();
        return `<button class="item" data-id="${esc(d.id)}"><b>${esc(c.title)}</b><span>${esc(c.description)}</span></button>`; }).join("");
    view.innerHTML = h;
    view.querySelectorAll(".item").forEach(b => b.onclick = () => showCourse(b.dataset.id));
    if (isAdmin) $("addCourse").onclick = async () => {
      const title = $("cT").value.trim();
      if (!title) { $("cMsg").textContent = "اكتب اسم الكورس."; $("cMsg").className="msg err"; return; }
      try {
        await db.collection("courses").add({ title, description: $("cD").value.trim(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        showCourses();
      } catch (e) { $("cMsg").textContent = dbErr(e); $("cMsg").className="msg err"; }
    };
  } catch (e) { view.innerHTML = `<p class="empty err" style="color:#ffb4ab">${dbErr(e)}</p>`; }
}

async function showCourse(id){
  view.innerHTML = '<p class="empty">جاري التحميل...</p>';
  try {
    const ref = db.collection("courses").doc(id);
    const [cs, ls] = await Promise.all([ref.get(), ref.collection("lessons").orderBy("createdAt").get()]);
    const c = cs.data() || {};
    const lessons = ls.docs.map(d => d.data());
    let h = `<button class="back" id="back" type="button">→ رجوع للكورسات</button>
      <h2 style="color:#fff">${esc(c.title)}</h2><p class="sub">${esc(c.description)}</p><div id="lesson"></div>`;
    h += lessons.length ? lessons.map((l,i) => `<button class="item" data-i="${i}"><b>${i+1}. ${esc(l.title)}</b></button>`).join("")
                        : '<p class="empty">لسه مفيش دروس في الكورس ده.</p>';
    if (isAdmin) h += `<div class="card"><h2>إضافة درس</h2>
      <label for="lT">عنوان الدرس</label><input id="lT">
      <label for="lV">رابط الفيديو (يوتيوب)</label><input id="lV" dir="ltr">
      <label for="lN">ملاحظات (اختياري)</label><textarea id="lN"></textarea>
      <button class="go" id="addLesson" type="button">إضافة الدرس</button><p id="lMsg" class="msg"></p></div>`;
    view.innerHTML = h;
    $("back").onclick = showCourses;
    view.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
      const l = lessons[b.dataset.i], e = l.videoUrl && ytEmbed(l.videoUrl);
      $("lesson").innerHTML = `<div class="card"><h2>${esc(l.title)}</h2>` +
        (e ? `<div class="player"><iframe src="${esc(e)}" allowfullscreen loading="lazy"></iframe></div>`
           : (l.videoUrl ? `<a href="${esc(l.videoUrl)}" target="_blank" rel="noopener">افتح الفيديو</a>` : "")) +
        (l.notes ? `<p>${esc(l.notes)}</p>` : "") + "</div>";
      $("lesson").scrollIntoView({behavior:"smooth"});
    });
    if (isAdmin) $("addLesson").onclick = async () => {
      const title = $("lT").value.trim();
      if (!title) { $("lMsg").textContent = "اكتب عنوان الدرس."; $("lMsg").className="msg err"; return; }
      try {
        await ref.collection("lessons").add({ title, videoUrl: $("lV").value.trim(), notes: $("lN").value.trim(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        showCourse(id);
      } catch (e) { $("lMsg").textContent = dbErr(e); $("lMsg").className="msg err"; }
    };
  } catch (e) { view.innerHTML = `<p class="empty" style="color:#ffb4ab">${dbErr(e)}</p>`; }
}

auth.onAuthStateChanged(user => {
  $("auth").classList.toggle("hide", !!user);
  $("app").classList.toggle("hide", !user);
  $("sub").textContent = user ? "كورساتك ودروسك." : "سجّل دخولك وكمّل دروسك.";
  if (user) {
    isAdmin = (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();
    $("hello").textContent = "أهلًا يا " + (user.displayName || "طالبنا") + (isAdmin ? " (مدرس)" : "");
    showCourses();
  }
});
</script>
</body>
</html>
